<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurvivorHallOfFamer Dashboard</title>
    <style>
        body { font-family: Arial; background: #1a1a2e; color: white; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .header { background: #16213e; border-radius: 15px; padding: 25px; text-align: center; }
        .status { display: inline-block; padding: 8px 20px; border-radius: 20px; background: #00ff00; }
        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0; }
        .stat-card { background: #16213e; border-radius: 10px; padding: 20px; text-align: center; }
        .stat-value { font-size: 1.8em; font-weight: bold; }
        .positive { color: #00ff00; }
        .negative { color: #ff4444; }
        .section { background: #16213e; border-radius: 15px; padding: 20px; margin-top: 20px; }
        .position-item { background: #1a1a2e; border-radius: 8px; padding: 15px; margin: 10px 0; }
        .profit { color: #00ff00; }
        .loss { color: #ff4444; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 SurvivorHallOfFamer</h1>
            <div class="status">PROFITABLE</div>
            <p>Updated: 2026-09-08 12:45:13</p>
        </div>
        <div class="stats">
            <div class="stat-card">
                <div>💰 Balance</div>
                <div class="stat-value">$1000.00</div>
            </div>
            <div class="stat-card">
                <div>📈 Today's P&L</div>
                <div class="stat-value positive">$0.00</div>
            </div>
            <div class="stat-card">
                <div>🔄 Trades Today</div>
                <div class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div>📌 Positions</div>
                <div class="stat-value">0</div>
            </div>
        </div>
        <div class="section">
            <h2>Open Positions</h2>
            <p>No open positions</p>
        </div>
    </div>
</body>
</html>
