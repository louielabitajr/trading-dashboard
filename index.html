<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurvivorHallOfFamer Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .container { max-width: 1000px; margin: auto; }
        .header {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
        }
        .status {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            background: #00ff00;
            color: white;
            font-weight: bold;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        .stat-label { color: #666; font-size: 0.9em; }
        .stat-value { font-size: 1.8em; font-weight: bold; margin-top: 5px; }
        .positive { color: #00b894; }
        .negative { color: #d63031; }
        .section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .position-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .profit { color: #00b894; font-weight: bold; }
        .loss { color: #d63031; font-weight: bold; }
        .footer { text-align: center; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 SurvivorHallOfFamer Bot</h1>
            <div class="status">PROFITABLE</div>
            <p style="color: #666;">Last Updated: 2026-09-08 09:36:58</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">💰 Balance</div>
                <div class="stat-value">$1000.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">📈 Today's P&L</div>
                <div class="stat-value positive">
                    $0.00
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">📊 Win Rate</div>
                <div class="stat-value">0.0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">🔄 Trades Today</div>
                <div class="stat-value">0</div>
            </div>
        </div>
        
        <div class="section">
            <h2>📌 Open Positions</h2>
            <p style="color: #666;">No open positions</p>
        </div>
        
        <div class="footer">
            Auto-updates | SurvivorHallOfFamer Bot
        </div>
    </div>
</body>
</html>
